<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Prevents the browser from caching the page for the back button -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>YPS Resort | Royal Banquets & Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --royal-blue: #002366;
            --gold: #d4af37;
            --white: #ffffff;
            --soft-gray: #f4f7f9;
            --text-dark: #1a1a1a;
        }

        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--white);
            color: var(--text-dark);
            scroll-behavior: smooth;
            /* Hide the body content initially until authentication is verified */
            opacity: 0; 
            transition: opacity 0.3s ease;
        }

        /* --- Navigation --- */
        nav {
            background: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--royal-blue);
            letter-spacing: 1px;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--royal-blue);
            margin-left: 30px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        /* --- Hero Section --- */
        .hero {
            height: 70vh;
            background: linear-gradient(rgba(0, 35, 102, 0.6), rgba(0, 35, 102, 0.6)), 
                        url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1500');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        /* --- The Vertical Booking Bar (Fixed Structure) --- */
        .booking-bar {
            background: var(--white);
            width: 85%;
            max-width: 1100px;
            margin: -60px auto 0;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 10;
            border-bottom: 4px solid var(--gold);
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--royal-blue);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-group select, .input-group input {
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            font-family: inherit;
            outline: none;
            background: var(--soft-gray);
        }

        .btn-book {
            background: var(--royal-blue);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: auto;
        }

        .btn-book:hover {
            background: var(--gold);
        }

        /* --- Footer --- */
        footer {
            background: var(--royal-blue);
            color: white;
            padding: 50px 8%;
            text-align: center;
            margin-top: 60px;
        }

        .gold-divider {
            width: 50px;
            height: 3px;
            background: var(--gold);
            margin: 20px auto;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .booking-bar { grid-template-columns: 1fr; margin-top: -20px; width: 90%; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">YPS RESORT</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a id="logoutBtn">Sign Out</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Plan Your Royal Event</h1>
        <p>MEMORIES THAT LAST A LIFETIME</p>
    </section>

    <div class="booking-bar">
        <div class="input-group">
            <label>Select Event</label>
            <select>
                <option>Wedding Ceremony</option>
                <option>Upnayan Sanskar</option>
                <option>Engagement Ceremony</option>
                <option>Wedding Reception</option>
                <option>Mehandi Ceremony</option>
                <option>Sangeet Ceremony</option>
                <option>Birthday Party</option>
                <option>Farewell Party</option>
                <option>Corporate Party</option>
                <option>Conference</option>
                <option>Seminar</option>
                <option>Workshop</option>
                <option>Concert</option>
            </select>
        </div>
        <div class="input-group">
            <label>Event Date</label>
            <input type="date">
        </div>
        <div class="input-group">
            <label>Guests </label>
            <input type="number" id="guest" min="1" max="5000">
        </div>
        <button class="btn-book" onclick="alert('Availability checked!')">
         Check Availability
        </button>
    </div>

    <footer>
        <div class="logo" style="color:white">YPS RESORT</div>
        <p>Khabra, Muzafarpur, National Highway 28</p>
        <p>Email: info@ypsresort.com | Phone: +91 98765 XXXXX</p>
        <div class="gold-divider"></div>
        <p style="font-size: 12px; opacity: 0.7;">&copy; 2026 YPS Resort. All Rights Reserved.</p>
    </footer>
   
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged,
    signOut // <-- Added missing import
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDqxBxM2kVUdG11EdYgwh4jfKbjrvbwXkA",
    authDomain: "yps-resort-sample.firebaseapp.com",
    projectId: "yps-resort-sample",
    storageBucket: "yps-resort-sample.firebasestorage.app",
    messagingSenderId: "102739599449",
    appId: "1:102739599449:web:96ddb83d95282cd8ec1148",
    measurementId: "G-ZYL0XVPZ30"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Strict Security Check
onAuthStateChanged(auth, (user) => {
    // We check BOTH Firebase Auth and your custom LocalStorage token to ensure they aren't kicked out unfairly
    const localUser = localStorage.getItem("ypsUserData");

    if (user || localUser) {
        // User is logged in. Reveal the page by setting opacity to 1.
        document.body.style.opacity = "1";
    } else {
        // User is NOT logged in.
        alert("Access Denied: You must be logged in to view this page.");
        // window.location.replace completely removes this page from the browser history
        window.location.replace("index.html"); 
    }
});

// Logout System
const logoutBtn = document.getElementById("logoutBtn");
if (logoutBtn) {
    logoutBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        try {
            // Sign out of Firebase
            await signOut(auth);
            
            // Wipe local storage tokens
            localStorage.removeItem("ypsUserData");
            
            // Redirect using replace so they cannot click 'back'
            window.location.replace("index.html");
        } catch (error) {
            console.error("Logout Error:", error);
        }
    });
}
</script>

</body>
</html>
