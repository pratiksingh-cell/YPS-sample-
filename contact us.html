<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="image/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YPS Resort | Contact Us</title>
    
    <!-- Google Fonts for Premium Look -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ================= DESIGN SYSTEM ================= */
        :root {
            --primary-blue: #0A192F; 
            --primary-blue-light: #172A45;
            --accent-gold: #D4AF37; 
            --accent-gold-hover: #F3C63F;
            --accent-gold-soft: rgba(212, 175, 55, 0.12);
            --bg-body: #F8FAFC;
            --surface-white: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= NAVBAR ================= */
        nav {
            background-color: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .logo-img {
            height: 42px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .logo {
            color: var(--accent-gold);
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-links a {
            color: #E2E8F0;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: var(--transition-smooth);
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        .btn-book {
            background: linear-gradient(135deg, var(--accent-gold) 0%, #B89028 100%);
            color: var(--primary-blue);
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-transform: uppercase;
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
        }

        .btn-book:hover {
            background: linear-gradient(135deg, var(--accent-gold-hover) 0%, var(--accent-gold) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
        }

        .auth-hidden {
            display: none !important;
        }

        /* ================= HERO SECTION ================= */
        .hero {
            position: relative;
            background: linear-gradient(180deg, var(--primary-blue) 0%, var(--primary-blue-light) 100%);
            color: white;
            text-align: center;
            padding: 90px 20px;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #FFF 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 1.15rem;
            color: #94A3B8;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 300;
        }

        /* ================= CONTACT SECTION ================= */
        .contact-section {
            padding: 70px 5%;
            margin-top: -30px;
            position: relative;
            z-index: 10;
        }

        .contact-container {
            max-width: 1240px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: stretch;
        }

        /* Left Column: Info & Form */
        .contact-left {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .contact-details {
            background: var(--surface-white);
            padding: 36px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
            border-left: 6px solid var(--accent-gold);
        }

        .contact-details h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-blue);
            font-size: 1.85rem;
            margin-bottom: 20px;
        }

        .contact-details p {
            font-size: 1.05rem;
            margin: 16px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .contact-form {
            background: var(--surface-white);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
        }

        .contact-form h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-blue);
            font-size: 1.75rem;
            margin-bottom: 24px;
        }

        .contact-form label {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--primary-blue);
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contact-form input, 
        .contact-form textarea {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-md);
            background-color: #F8FAFC;
            font-family: inherit;
            font-size: 0.975rem;
            color: var(--text-main);
            transition: var(--transition-smooth);
        }

        .contact-form input:focus, 
        .contact-form textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
            background-color: var(--surface-white);
            box-shadow: 0 0 0 4px var(--accent-gold-soft);
        }

        .contact-form textarea {
            height: 130px;
            resize: vertical;
        }

        .contact-form button {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 12px rgba(10, 25, 47, 0.15);
        }

        .contact-form button:hover {
            background: var(--accent-gold);
            color: var(--primary-blue);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
            transform: translateY(-2px);
        }

        /* Right Column: Map */
        .map-container {
            width: 100%;
            height: 100%;
            min-height: 500px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
            background: var(--surface-white);
            transition: var(--transition-smooth);
        }

        .map-container:hover {
            box-shadow: 0 25px 30px -5px rgba(15, 23, 42, 0.12);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: 0;
            display: block;
        }

        /* ================= FOOTER ================= */
        footer {
            background-color: var(--primary-blue);
            color: #94A3B8;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ================= MOBILE RESPONSIVENESS ================= */
        @media (max-width: 992px) {
            .contact-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .map-container {
                min-height: 400px;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 14px 20px;
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                gap: 20px;
            }

            .hero {
                padding: 60px 20px;
            }

            .hero h1 {
                font-size: 2.25rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .contact-section {
                padding: 30px 16px;
                margin-top: 0;
            }

            .contact-details, 
            .contact-form {
                padding: 24px;
            }

            .contact-details h2, 
            .contact-form h3 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Standard YPS Navigation Bar -->
    <nav>
        <a href="index.html" class="logo-container">
            <img src="image/logo.png" alt="YPS Logo" class="logo-img">
            <div class="logo">YPS RESORT</div>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <button class="btn-book" id="bookNowBtn">Book Now</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Get in Touch</h1>
        <p>We are here to assist you with your perfect stay.</p>
    </div>

    <!-- Main Contact Layout -->
    <div class="contact-section">
        <div class="contact-container">
            
            <!-- Left Side: Info & Form -->
            <div class="contact-left">
                
                <div class="contact-details">
                    <h2>Contact Information</h2>
                    <p>📍 Muzaffarpur, Bihar, India</p>
                    <p>📞 +91 98765XXXXX</p>
                    <p>✉️ yps@gmail.com</p>
                    <p>🕒 Mon - Sun : 9 AM - 8 PM</p>
                </div>

                <div class="contact-form">
                    <h3>Send us a Message</h3>
                    <form id="contactForm">
                        <label for="contactName">Full Name</label>
                        <input type="text" id="contactName" placeholder="Your Full Name" required>
                        
                        <label for="contactEmail">Email Address</label>
                        <input type="email" id="contactEmail" placeholder="name@example.com" required>
                        
                        <label for="contactMessage">Message</label>
                        <textarea id="contactMessage" placeholder="How can we help you?" required></textarea>
                        
                        <button type="submit" id="submitBtn">Send Message</button>
                    </form>
                </div>

            </div>

            <!-- Right Side: Map -->
            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d345.81959939566474!2d85.37627568252347!3d26.099104810897252!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sin!4v1773988801449!5m2!1sen!2sin"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

        </div>
    </div>

    <!-- Standard YPS Footer -->
    <footer>
        <p>&copy; 2026 YPS Resort. All Rights Reserved.</p>
    </footer>

<!-- Firebase Integration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDqxBxM2kVUdG11EdYgwh4jfKbjrvbwXkA",
        authDomain: "yps-resort-sample.firebaseapp.com",
        projectId: "yps-resort-sample",
        storageBucket: "yps-resort-sample.firebasestorage.app",
        messagingSenderId: "102739599449",
        appId: "1:102739599449:web:96ddb83d95282cd8ec1148",
        measurementId: "G-ZYL0XVPZ30"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Navbar state handling
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("nav-login")?.classList.add("auth-hidden");
            document.getElementById("nav-bookings")?.classList.remove("auth-hidden");
            document.getElementById("nav-profile")?.classList.remove("auth-hidden");
            document.getElementById("nav-logout")?.classList.remove("auth-hidden");
            
            const emailInput = document.getElementById("contactEmail");
            if (emailInput && !emailInput.value) emailInput.value = user.email;
        } else {
            document.getElementById("nav-login")?.classList.remove("auth-hidden");
            document.getElementById("nav-bookings")?.classList.add("auth-hidden");
            document.getElementById("nav-profile")?.classList.add("auth-hidden");
            document.getElementById("nav-logout")?.classList.add("auth-hidden");
        }
    });

    // Logout
    document.getElementById("nav-logout")?.addEventListener("click", async (e) => {
        e.preventDefault();
        await signOut(auth);
        window.location.href = "index.html";
    });

    // Contact Form Handler
    document.getElementById("contactForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.innerText = "Sending...";
        btn.disabled = true;

        if (firebaseConfig.apiKey === "YOUR_API_KEY" || firebaseConfig.projectId === "YOUR_PROJECT_ID") {
            alert("❌ Setup Error: You haven't replaced the placeholder keys in 'firebaseConfig' with your actual Firebase credentials!");
            btn.innerText = "Send Message";
            btn.disabled = false;
            return;
        }

        const formData = {
            name: document.getElementById("contactName").value,
            email: document.getElementById("contactEmail").value,
            message: document.getElementById("contactMessage").value,
            timestamp: serverTimestamp()
        };

        try {
            const timeout = new Promise((_, reject) =>
                setTimeout(() => reject(new Error("Timeout: Database did not respond in 8 seconds. Check your Firestore Security Rules or check if the database was created.")), 8000)
            );

            await Promise.race([
                addDoc(collection(db, "contact_messages"), formData),
                timeout
            ]);

            alert("Thank you! Your message has been sent successfully.");
            document.getElementById("contactForm").reset();

        } catch (error) {
            console.error("❌ Firebase Error:", error);
            alert(error.message);
        } finally {
            btn.innerText = "Send Message";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
