<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="image/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YPS Resort | Contact Us</title>
    
    <!-- Google Fonts for Premium Look -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* ================= GLOBAL ================= */
        :root {
            --primary-blue: #002366; /* Royal Blue */
            --primary-blue-dark: #001845;
            --accent-gold: #d4af37;  /* Premium Gold */
            --accent-gold-hover: #bda031;
            --light-bg: #f4f7f9;
            --text-dark: #333333;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--light-bg);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* ================= NAVBAR ================= */
        nav {
            background-color: var(--primary-blue);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 40px;
            width: auto;
        }

        .logo {
            color: var(--accent-gold);
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        .btn-book {
            background-color: var(--accent-gold);
            color: var(--primary-blue-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-book:hover {
            background-color: var(--accent-gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.4);
        }

        .auth-hidden {
            display: none !important;
        }

        /* ================= HERO SECTION ================= */
        .hero {
            background: linear-gradient(135deg, var(--primary-blue-dark) 0%, var(--primary-blue) 100%);
            color: white;
            text-align: center;
            padding: 80px 20px;
            border-bottom: 5px solid var(--accent-gold);
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            color: var(--accent-gold);
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin: 0;
            font-weight: 300;
        }

        /* ================= CONTACT SECTION ================= */
        .contact-section {
            padding: 60px 5%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .contact-container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        /* Left Column: Info & Form */
        .contact-left {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .contact-details {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border-left: 5px solid var(--primary-blue);
        }

        .contact-details h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-blue);
            margin-top: 0;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .contact-details p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #555;
        }

        .contact-form {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .contact-form h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-blue);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .contact-form label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--primary-blue-dark);
            display: block;
            margin-bottom: 8px;
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .contact-form input:focus, .contact-form textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
            background-color: #fff;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .contact-form textarea {
            height: 140px;
            resize: vertical;
        }

        .contact-form button {
            background: var(--primary-blue);
            color: white;
            border: 2px solid var(--primary-blue);
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-form button:hover {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: var(--primary-blue-dark);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        /* Right Column: Map */
        .map-container {
            flex: 1.2;
            min-width: 350px;
            height: 100%;
            min-height: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,35,102,0.1);
            border: 6px solid white;
            transition: transform 0.3s ease;
        }

        .map-container:hover {
            transform: scale(1.01);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: 0;
        }

        /* ================= FOOTER ================= */
        footer {
            background-color: var(--primary-blue-dark);
            color: white;
            text-align: center;
            padding: 25px 20px;
            margin-top: 40px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        /* ================= MOBILE RESPONSIVENESS ================= */
        @media (max-width: 850px) {
            .contact-container {
                flex-direction: column;
            }
            .map-container, .map-container iframe {
                min-height: 400px;
            }
        }

        @media (max-width: 768px) {
            /* Mobile Navbar styling */
            nav {
                flex-direction: column;
                padding: 15px 20px;
                gap: 15px;
            }

            .logo-container {
                justify-content: center;
                width: 100%;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 15px;
            }

            /* Adjust Hero Section */
            .hero {
                padding: 50px 15px;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .hero p {
                font-size: 1rem;
            }

            /* Adjust Contact Section Padding */
            .contact-section {
                padding: 40px 5%;
            }

            .contact-left {
                min-width: 100%;
            }

            .map-container {
                min-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .contact-details, .contact-form {
                padding: 25px 20px;
            }

            .hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Standard YPS Navigation Bar -->
    <nav>
        <a href="index.html" class="logo-container">
            <img src="image/logo.png" alt="YPS Logo" class="logo-img">
            <div class="logo">YPS RESORT</div>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <button class="btn-book" id="bookNowBtn">Book Now</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Get in Touch</h1>
        <p>We are here to assist you with your perfect stay.</p>
    </div>

    <!-- Main Contact Layout -->
    <div class="contact-section">
        <div class="contact-container">
            
            <!-- Left Side: Info & Form -->
            <div class="contact-left">
                
                <div class="contact-details">
                    <h2>Contact Information</h2>
                    <p>📍 Muzaffarpur, Bihar, India</p>
                    <p>📞 +91 98765XXXXX</p>
                    <p>✉️ yps@gmail.com</p>
                    <p>🕒 Mon - Sun : 9 AM - 8 PM</p>
                </div>

                <div class="contact-form">
                    <h3>Send us a Message</h3>
                    <form id="contactForm">
                        <label for="contactName">Full Name</label>
                        <input type="text" id="contactName" placeholder="Your Full Name" required>
                        
                        <label for="contactEmail">Email Address</label>
                        <input type="email" id="contactEmail" placeholder="name@example.com" required>
                        
                        <label for="contactMessage">Message</label>
                        <textarea id="contactMessage" placeholder="How can we help you?" required></textarea>
                        
                        <button type="submit" id="submitBtn">Send Message</button>
                    </form>
                </div>

            </div>

            <!-- Right Side: Map -->
            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d345.81959939566474!2d85.37627568252347!3d26.099104810897252!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sin!4v1773988801449!5m2!1sen!2sin"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

        </div>
    </div>

    <!-- Standard YPS Footer -->
    <footer>
        <p>&copy; 2026 YPS Resort. All Rights Reserved.</p>
    </footer>

<!-- Firebase Integration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDqxBxM2kVUdG11EdYgwh4jfKbjrvbwXkA",
        authDomain: "yps-resort-sample.firebaseapp.com",
        projectId: "yps-resort-sample",
        storageBucket: "yps-resort-sample.firebasestorage.app",
        messagingSenderId: "102739599449",
        appId: "1:102739599449:web:96ddb83d95282cd8ec1148",
        measurementId: "G-ZYL0XVPZ30"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Navbar state handling
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("nav-login")?.classList.add("auth-hidden");
            document.getElementById("nav-bookings")?.classList.remove("auth-hidden");
            document.getElementById("nav-profile")?.classList.remove("auth-hidden");
            document.getElementById("nav-logout")?.classList.remove("auth-hidden");
            
            const emailInput = document.getElementById("contactEmail");
            if (emailInput && !emailInput.value) emailInput.value = user.email;
        } else {
            document.getElementById("nav-login")?.classList.remove("auth-hidden");
            document.getElementById("nav-bookings")?.classList.add("auth-hidden");
            document.getElementById("nav-profile")?.classList.add("auth-hidden");
            document.getElementById("nav-logout")?.classList.add("auth-hidden");
        }
    });

    // Logout
    document.getElementById("nav-logout")?.addEventListener("click", async (e) => {
        e.preventDefault();
        await signOut(auth);
        window.location.href = "index.html";
    });

    // Contact Form Handler
    document.getElementById("contactForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.innerText = "Sending...";
        btn.disabled = true;

        if (firebaseConfig.apiKey === "YOUR_API_KEY" || firebaseConfig.projectId === "YOUR_PROJECT_ID") {
            alert("❌ Setup Error: You haven't replaced the placeholder keys in 'firebaseConfig' with your actual Firebase credentials!");
            btn.innerText = "Send Message";
            btn.disabled = false;
            return;
        }

        const formData = {
            name: document.getElementById("contactName").value,
            email: document.getElementById("contactEmail").value,
            message: document.getElementById("contactMessage").value,
            timestamp: serverTimestamp()
        };

        try {
            const timeout = new Promise((_, reject) =>
                setTimeout(() => reject(new Error("Timeout: Database did not respond in 8 seconds. Check your Firestore Security Rules or check if the database was created.")), 8000)
            );

            await Promise.race([
                addDoc(collection(db, "contact_messages"), formData),
                timeout
            ]);

            alert("Thank you! Your message has been sent successfully.");
            document.getElementById("contactForm").reset();

        } catch (error) {
            console.error("❌ Firebase Error:", error);
            alert(error.message);
        } finally {
            btn.innerText = "Send Message";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
