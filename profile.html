<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | YPS Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --royal-blue: #002366;
            --gold: #d4af37;
            --white: #ffffff;
            --soft-gray: #f4f7f9;
            --text-dark: #1a1a1a;
            --danger-red: #e74c3c;
            --success-green: #2ecc71;
        }

        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--soft-gray);
            color: var(--text-dark);
            opacity: 0; 
            transition: opacity 0.3s ease;
        }

        /* Navigation */
        nav {
            background: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; color: var(--royal-blue); }
        .nav-links a { text-decoration: none; color: var(--royal-blue); margin-left: 30px; font-weight: 700; font-size: 14px; text-transform: uppercase; cursor: pointer; }
        .nav-links a:hover { color: var(--gold); }

        /* Profile Container */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-header {
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-left: 5px solid var(--royal-blue);
        }

        .profile-info h2 { margin: 0 0 5px 0; color: var(--royal-blue); font-family: 'Playfair Display', serif; }
        .profile-info p { margin: 0; color: #666; }

        .btn-delete-data {
            background: var(--white);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-delete-data:hover { background: var(--danger-red); color: white; }

        /* Bookings Section */
        h3 { font-family: 'Playfair Display', serif; color: var(--royal-blue); border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-top: 40px;}

        .booking-card {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .booking-details h4 { margin: 0 0 5px 0; color: var(--royal-blue); font-size: 18px; }
        .booking-details p { margin: 3px 0; font-size: 14px; color: #555; }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pending { background: #ffeaa7; color: #d35400; }
        .status-confirmed { background: #e8f8f5; color: var(--success-green); }
        .status-cancelled { background: #fadbd8; color: var(--danger-red); }

        .btn-cancel {
            background: var(--danger-red);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-cancel:hover { background: #c0392b; }

        .empty-state { text-align: center; padding: 40px; color: #777; background: var(--white); border-radius: 10px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">YPS RESORT</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="book now.html">Book Now</a>
            <a id="logoutBtn">Sign Out</a>
        </div>
    </nav>

    <div class="container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-info">
                <h2 id="userNameDisplay">Loading...</h2>
                <p id="userEmailDisplay">Loading...</p>
            </div>
            <button class="btn-delete-data" id="deleteDataBtn">Request Data Deletion</button>
        </div>

        <!-- Active Bookings -->
        <h3>Active & Upcoming Bookings</h3>
        <div id="activeBookingsContainer">
            <div class="empty-state">Loading your bookings...</div>
        </div>

        <!-- Past / Cancelled Bookings -->
        <h3>Past & Cancelled Bookings</h3>
        <div id="pastBookingsContainer">
            <div class="empty-state">Loading your history...</div>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDqxBxM2kVUdG11EdYgwh4jfKbjrvbwXkA",
    authDomain: "yps-resort-sample.firebaseapp.com",
    projectId: "yps-resort-sample",
    storageBucket: "yps-resort-sample.firebasestorage.app",
    messagingSenderId: "102739599449",
    appId: "1:102739599449:web:96ddb83d95282cd8ec1148",
    measurementId: "G-ZYL0XVPZ30"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.addEventListener("DOMContentLoaded", async () => {
    // 1. Verify Login
    const localUserStr = localStorage.getItem("ypsUserData");
    if (!localUserStr) {
        alert("Please log in to view your profile.");
        window.location.replace("index.html");
        return;
    }

    const localUser = JSON.parse(localUserStr);
    document.body.style.opacity = "1"; // Reveal page
    
    document.getElementById("userNameDisplay").textContent = localUser.name;
    document.getElementById("userEmailDisplay").textContent = localUser.email;

    // 2. Fetch Bookings Logic
    async function loadBookings() {
        const activeContainer = document.getElementById("activeBookingsContainer");
        const pastContainer = document.getElementById("pastBookingsContainer");
        
        activeContainer.innerHTML = "";
        pastContainer.innerHTML = "";

        try {
            const requestsRef = collection(db, "booking_requests");
            const q = query(requestsRef, where("userEmail", "==", localUser.email));
            const querySnapshot = await getDocs(q);

            let hasActive = false;
            let hasPast = false;

            // Get today's date in YYYY-MM-DD for comparison
            const today = new Date().toISOString().split('T')[0];

            querySnapshot.forEach((documentSnapshot) => {
                const data = documentSnapshot.data();
                const docId = documentSnapshot.id;
                
                // Determine if booking is past/cancelled or active
                const isCancelled = data.status === "cancelled";
                const isPastDate = data.eventDate < today;
                const isPastCategory = isCancelled || isPastDate;

                const cardHTML = `
                    <div class="booking-card">
                        <div class="booking-details">
                            <h4>${data.eventType}</h4>
                            <p><strong>Date:</strong> ${data.eventDate}</p>
                            <p><strong>Guests:</strong> ${data.guests}</p>
                        </div>
                        <div style="text-align: right;">
                            <span class="status-badge status-${data.status}">${data.status}</span>
                            ${!isPastCategory ? `<br><button class="btn-cancel" data-id="${docId}">Cancel Booking</button>` : ''}
                        </div>
                    </div>
                `;

                if (isPastCategory) {
                    pastContainer.innerHTML += cardHTML;
                    hasPast = true;
                } else {
                    activeContainer.innerHTML += cardHTML;
                    hasActive = true;
                }
            });

            if (!hasActive) activeContainer.innerHTML = `<div class="empty-state">No active bookings found.</div>`;
            if (!hasPast) pastContainer.innerHTML = `<div class="empty-state">No past or cancelled bookings.</div>`;

        } catch (error) {
            console.error("Error fetching bookings:", error);
            activeContainer.innerHTML = `<div class="empty-state">Error loading bookings.</div>`;
        }
    }

    // Initial Load
    await loadBookings();

    // 3. Cancel Booking Logic (Event Delegation)
    document.getElementById("activeBookingsContainer").addEventListener("click", async (e) => {
        if (e.target.classList.contains("btn-cancel")) {
            const docId = e.target.getAttribute("data-id");
            const confirmCancel = confirm("Are you sure you want to cancel this booking request?");
            
            if (confirmCancel) {
                e.target.textContent = "Cancelling...";
                try {
                    const bookingRef = doc(db, "booking_requests", docId);
                    await updateDoc(bookingRef, { status: "cancelled" });
                    alert("Booking has been cancelled successfully.");
                    loadBookings(); // Refresh the lists
                } catch (error) {
                    console.error("Error cancelling:", error);
                    alert("Failed to cancel. Please try again.");
                    e.target.textContent = "Cancel Booking";
                }
            }
        }
    });

    // 4. Delete All Data Logic
    document.getElementById("deleteDataBtn").addEventListener("click", async () => {
        const confirmDelete = confirm(
            "WARNING: This will permanently delete your account, all your booking history, and personal data from our servers.\n\nAre you sure you want to proceed?"
        );

        if (confirmDelete) {
            try {
                // Delete user from marketing_leads
                const leadRef = doc(db, "marketing_leads", localUser.email);
                await deleteDoc(leadRef);

                // Find and delete all booking requests for this user
                const requestsRef = collection(db, "booking_requests");
                const q = query(requestsRef, where("userEmail", "==", localUser.email));
                const querySnapshot = await getDocs(q);
                
                // Wait for all deletions to finish
                const deletePromises = [];
                querySnapshot.forEach((documentSnapshot) => {
                    deletePromises.push(deleteDoc(doc(db, "booking_requests", documentSnapshot.id)));
                });
                await Promise.all(deletePromises);

                // Clear local storage & Log out
                localStorage.removeItem("ypsUserData");
                alert("Your data has been completely removed from our system.");
                window.location.replace("index.html");

            } catch (error) {
                console.error("Error deleting data:", error);
                alert("An error occurred while trying to delete your data. Please contact support.");
            }
        }
    });

    // 5. Logout Button
    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("ypsUserData");
        window.location.replace("index.html");
    });
});
</script>

</body>
</html>
